<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS CI/CD Demo</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#141e30,#243b55);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
    background:rgba(255,255,255,0.1);
    padding:50px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
    font-size:50px;
    margin-bottom:15px;
}

p{
    font-size:20px;
    color:#dcdcdc;
}

button{
    margin-top:20px;
    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:#00c6ff;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    background:#0072ff;
}
</style>
</head>

<body>

<div class="container">
    <h1>🚀 AWS CI/CD Project</h1>
    <p>Your website is successfully running in browser.</p>

    <button onclick="showMessage()">
        Click Me
    </button>
</div>

<script>
function showMessage(){
    alert("Website deployed successfully!");
}
</script>

</body>
</html>
