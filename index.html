<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AWS Website</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
}

.box{
    text-align:center;
    background:rgba(255,255,255,0.1);
    padding:50px;
    border-radius:20px;
    backdrop-filter:blur(10px);
}

h1{
    font-size:50px;
}

p{
    font-size:20px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:#00c6ff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0072ff;
}
</style>
</head>

<body>

<div class="box">
    <h1>🚀 Website Running</h1>
    <p>AWS CI/CD Successfully Working</p>

    <button onclick="showMsg()">
        Click Here
    </button>
</div>

<script>
function showMsg(){
    alert("Website is running successfully!");
}
</script>

</body>
</html>
